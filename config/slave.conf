# Slave configuration

port=8081
role=slave

# Master endpoint
master_ip=192.168.36.141
master_port=8080
sync_port = 9080 

# AOF settings on slave (normally you can keep it enabled)
enable_aof=yes
aof_fsync_mode=everysec
aof_filename=data/kvstore-slave.aof

# Persistence files
rdb_filename=data/kvstore-slave.rdb
dump_filename=kvstore-slave.dat

# Network model (reactor|proactor|ntyco)
network_mode=reactor

# Memory backend (pool|system|jemalloc)
mem_backend=pool

# Logical max value size in bytes for a single key
# 0 means no logical limit (only protocol/implementation limits)
# e.g. 10485760 for 10MB
max_value_size = 1048576

# Synchronization mode (tcp|ebpf)
sync_mode = ebpf
ebpf_conf = config/ebpf_sync.conf