# Default single-node kvstore config
# This file is loaded when no --config is specified.
# Paths are resolved from config_root/data_dir, independent of process cwd.

config_root = ..
data_dir = data

# Server role: master | slave
role = master

# Listen port for client connections
port = 8080

# Logging
# error | warn | info | debug
log_level = info
log_async = no
# log_file = data/kvstore.log

# Master/slave sync port
# For master: port that slaves connect to for sync
# For slave: local port used to receive sync from master (optional)
sync_port = 9080

# Master address (used only when role=slave)
#master_ip = 127.0.0.1
#master_port = 8080

# AOF (Append Only File) persistence
# yes | no
enable_aof = no

# AOF fsync mode: always | everysec | no
# always   : fsync on every write (safest, slowest)
# everysec : fsync once per second (recommended)
# no       : rely on OS flush (fastest, less safe)
aof_fsync_mode = no

# AOF / RDB / snapshot file paths
# These should match the defaults in kvs_config_init_default
# and are resolved relative to data_dir
aof_filename  = data/kvstore.aof
rdb_filename  = data/kvstore.rdb
dump_filename = data/kvstore.dat

# Logical max value size in bytes for a single key
# 0 means no logical limit (only protocol/implementation limits)
# e.g. 10485760 for 10MB
max_value_size = 10485760

# Network implementation mode (if supported by build)
# reactor | proactor | ntyco
#network_mode = reactor

# Semantic cache vector path.
# This project uses L2-normalized embeddings + HNSW + inner product as the
# main path. hash is the built-in deterministic provider used until a local C
# ABI model provider is wired in.
embedding_provider = hash
# To exercise the in-process C ABI runtime:
# embedding_provider = local_c
# embedding_dim = 64
# embedding_num_threads = 1
# embedding_max_text_len = 4096
# embedding_model_path =
#
# ONNX embedding mode:
#   make setup-embedding
#   make embedding
#   ./kvstore -c config/kvstore-embedding.conf
vector_index_type = core_flat
vector_metric = ip
vector_hnsw_m = 32
vector_hnsw_ef_construction = 256
vector_hnsw_ef_search = 256
vector_score_threshold = 0.85
