# Master configuration

config_root=..
data_dir=data

port=9300
role=master

# AOF settings
enable_aof=no
aof_fsync_mode=everysec
aof_filename=data/kvstore-master.aof

# Persistence files
rdb_filename=data/kvstore-master.rdb
dump_filename=kvstore-master.dat

# Network model (reactor|proactor|ntyco)
network_mode=reactor

# Memory backend (pool|system|jemalloc)
mem_backend=pool

# Logical max value size in bytes for a single key
# 0 means no logical limit (only protocol/implementation limits)
# e.g. 10485760 for 10MB
max_value_size = 1048576

# Replication is disabled in this standalone profile. Use the canonical
# [replication]/[ebpf] example before enabling either transport.
sync_mode = disabled


# Logging
# error | warn | info | debug
log_level = error
log_async = yes
# log_file = data/kvstore.log

# Semantic cache vector path: L2-normalized embedding + HNSW + inner product.
# hash is the built-in deterministic provider used until local_c is wired in.
embedding_provider = hash
# embedding_provider = local_c
# embedding_dim = 64
# embedding_num_threads = 1
# embedding_max_text_len = 4096
vector_index_type=core_flat
vector_metric=ip

# Distance calculation backend
# auto: use AVX2 when supported, otherwise fallback
# fallback: force scalar C implementation
# avx2: prefer AVX2, fallback if CPU does not support it
vector_distance_backend=auto

vector_hnsw_m=32
vector_hnsw_ef_construction=256
vector_hnsw_ef_search=128
vector_score_threshold=0.85

# Scope overfetch for HNSW scoped search
# 1 means disabled
# valid range: 1~32
vector_scope_overfetch_factor=1
