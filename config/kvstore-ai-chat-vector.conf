# AI-chat 专用本地 ONNX 向量实例。该实例与 28080 验证实例完全隔离。
# data_dir、RDB、AOF、日志和端口均不与其他 KVLite 实例共享。

[server]
role = master
config_root = ..
data_dir = data/ai-chat-vector
test_mode = false

[network]
# AI-chat 和 KVLite 位于同一主机，不暴露到局域网。
listen_address = 127.0.0.1
port = 28081
mode = reactor
worker_threads = 1
max_connections = 128
listen_backlog = 128
max_request_bytes = 10485760
max_response_bytes = 2097152
max_commands_per_read = 1024

[storage]
memory_backend = pool
default_engine = array
enabled_engines = array
array_initial_capacity = 256
# 当前二进制仍会初始化已编译 Hash 后端；显式缩小其预分配。
hash_initial_capacity = 4096
max_value_bytes = 1048576

[ttl]
enabled = true
scan_enabled = true
scan_interval_ms = 1000
scan_budget = 32

[persistence]
# RDB 包含 question、answer、scope、embedding 和记录元数据；启动后重建 HNSW。
rdb_enabled = true
rdb_path = ai-chat-vector.rdb
# 本阶段仅允许受控写入；以 RDB 恢复验证为持久化基线，不复用现有实例的 AOF。
aof_enabled = false
aof_path = ai-chat-vector.aof
aof_fsync = no
aof_rewrite_enabled = true
aof_rewrite_min_bytes = 29360128
aof_rewrite_min_growth_bytes = 67108864
aof_rewrite_growth_percent = 50
legacy_dump_path = ai-chat-vector.dat
startup_recovery_order = rdb_then_aof_then_index

[vector]
enabled = true
index_type = core_hnsw_v2
dimension = 512
metric = ip
normalize = true
# 源码要求 M>=48、M0>=M、efConstruction>=M0；保持已经验证的构建质量参数。
hnsw_m = 48
hnsw_m0 = 96
hnsw_ef_construction = 512
# 100K 产品压测已验证的召回/延迟平衡点；20K 容量保留同一搜索质量。
hnsw_ef_search = 128
# HNSW 会按该容量预分配所有层。20K 约为当前 100K 实测索引内存的五分之一。
initial_capacity = 20000
default_topk = 1
# AI-chat 会显式传入阈值；此值仅保护直接 KVLite 客户端的默认查询。
default_threshold = 0.90
scope_overfetch_factor = 4
distance_backend = auto

[embedding]
provider = local_c
model_path = models/bge-small-zh-v1.5/model.onnx
vocab_path = models/bge-small-zh-v1.5/vocab.txt
output_dimension = 512
model_version = bge-small-zh-v1.5
intra_op_threads = 1
inter_op_threads = 0
ort_graph_optimization = basic
ort_execution_mode = sequential
worker_pool_enabled = true
worker_threads = 1
worker_queue_capacity = 1024
per_thread_runtime_enabled = false
per_thread_runtime_fallback_mutex = true
shared_ort_env_enabled = true
max_text_bytes = 512
max_tokens = 512
cache_enabled = true
cache_capacity = 5000
cache_ttl_ms = 3600000
cache_policy = lru

[vector_snapshot]
# RDB 已保存 embedding；本阶段用 RDB 重建 HNSW 作为恢复验收路径。
enabled = false

[vector_rebuild]
async_enabled = true
delta_initial_capacity = 16
delta_max_entries = 200000
retry_policy = manual
cancel_enabled = true
write_snapshot_after_publish = true

[replication]
transport = disabled
full_sync_policy = required
not_ready_query_policy = reject

[ebpf]
mode = disabled

[observability]
log_level = info
log_async = false
log_path = ai-chat-vector.log
vsearch_stage_stats_enabled = true
embedding_profile_enabled = false
hnsw_build_profile_enabled = false
hnsw_search_profile_enabled = false
