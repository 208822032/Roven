# ONNX embedding configuration

config_root=..
data_dir=data

port=28080
sync_port=29080
role=master

# AOF settings
enable_aof=no
aof_fsync_mode=no
aof_filename=data/kvstore-embedding.aof

# Persistence files
rdb_filename=data/kvstore-embedding.rdb
dump_filename=kvstore-embedding.dat

# Network model (reactor|proactor|ntyco)
network_mode=reactor

# Memory backend (pool|system|jemalloc)
mem_backend=pool

# Logical max value size in bytes for a single key
# 0 means no logical limit (only protocol/implementation limits)
max_value_size = 10485760

# Synchronization mode (tcp|ebpf)
sync_mode = tcp

# Logging
# error | warn | info | debug
log_level = info
log_async = no

# Semantic cache vector path: L2-normalized embedding + HNSW + inner product.
embedding_provider = local_c
embedding_model_path = models/bge-small-zh-v1.5/model.onnx
embedding_vocab_path = models/bge-small-zh-v1.5/vocab.txt
embedding_dim = 512
embedding_model_version = bge-small-zh-v1.5
# Stage 9: prepare worker pool is explicit and starts from one worker.
embedding_num_threads = 1
embedding_max_text_len = 512
embedding_max_tokens = 512
embedding_ort_graph_opt_level = basic
embedding_inter_threads = 0
embedding_ort_execution_mode = sequential
embedding_worker_pool_enabled = 1
embedding_worker_threads = 1
embedding_worker_queue_capacity = 1024
embedding_per_thread_runtime_enabled = 0
embedding_per_thread_runtime_fallback_mutex = 1
embedding_shared_ort_env_enabled = 1
embedding_cache_enabled = 1
embedding_cache_capacity = 10000
embedding_cache_ttl_ms = 3600000
embedding_cache_policy = lru
vector_index_type = core_flat
vector_metric = ip
vector_score_threshold = 0.75

# Distance calculation backend
# auto: use AVX2 when supported, otherwise fallback
# fallback: force scalar C implementation
# avx2: prefer AVX2, fallback if CPU does not support it
vector_distance_backend = auto

vector_hnsw_m = 32
vector_hnsw_ef_construction = 256
vector_hnsw_ef_search = 256

# Scope overfetch for HNSW scoped search
# 1 means disabled
# valid range: 1~32
vector_scope_overfetch_factor = 4
