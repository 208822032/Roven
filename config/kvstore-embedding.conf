# KVLite 本地 ONNX 文本向量单机配置。
# 使用前必须执行 make setup-embedding 和 make embedding，并确认模型与词表存在。
# 相对模型路径以 server.config_root 为基准；持久化路径以 server.data_dir 为基准。

[server]
# 节点角色。可选值：master、slave；本文件是单机向量服务，使用 master。
role = master
# 配置资源根目录。可选值：绝对路径或相对本配置文件目录的路径。
config_root = ..
# 运行数据目录。可选值：绝对路径，或相对 config_root 的路径。
data_dir = data
# 测试模式。可选值：true、false；正式运行使用 false。
test_mode = false

[network]
# 客户端监听地址。可选值：合法 IPv4 地址；0.0.0.0 表示监听所有网卡。
listen_address = 0.0.0.0
# 客户端服务端口。可选范围：1..65535。
port = 28080
# 网络模型。可选值：reactor、proactor、ntyco。
mode = reactor
# 网络工作线程数。当前可选值仅为 1。
worker_threads = 1
# 最大并发连接数。可选范围：1..1024。
max_connections = 1024
# TCP listen backlog。可选范围：1..65535。
listen_backlog = 1024
# 单个请求最大字节数。可选范围：1024..67108864。
max_request_bytes = 10485760
# 单个响应最大字节数。可选范围：1024..2097152。
max_response_bytes = 2097152
# 单次读取最多解析的命令数。可选范围：1..1000000。
max_commands_per_read = 1024

[storage]
# 内存分配后端。可选值：pool、system、jemalloc；必须与构建能力一致。
memory_backend = pool
# 默认存储引擎。可选值：array、rbtree、hash、skiptable。
default_engine = array
# 启用的存储引擎。可选值：四种引擎的无重复逗号分隔组合。
enabled_engines = array,rbtree,hash,skiptable
# array 初始容量。可选范围：1..10000000。
array_initial_capacity = 2048
# hash 初始容量。可选范围：1..10000000。
hash_initial_capacity = 1048576
# 单值逻辑大小上限，单位字节。可选范围：0..2147483647；0 表示不设额外逻辑上限。
max_value_bytes = 10485760

[ttl]
# 是否启用 TTL 命令语义。可选值：true、false。
enabled = true
# 是否启用后台主动过期扫描。可选值：true、false；关闭后仍保留惰性过期。
scan_enabled = true
# 后台扫描周期，单位毫秒。可选范围：10..86400000。
scan_interval_ms = 1000
# 每轮扫描预算。可选范围：1..1000000。
scan_budget = 32

[persistence]
# 是否启用 RDB 启动恢复和关闭保存。可选值：true、false。
rdb_enabled = true
# RDB 文件路径。可选值：绝对路径，或相对 server.data_dir 的路径。
rdb_path = kvstore-embedding.rdb
# 是否启用 AOF 写入和启动重放。可选值：true、false。
aof_enabled = false
# AOF 文件路径。可选值：绝对路径，或相对 server.data_dir 的路径。
aof_path = kvstore-embedding.aof
# AOF 刷盘策略。可选值：always、everysec、no。
aof_fsync = no
# 是否启用 AOF rewrite。可选值：true、false；AOF 关闭时处于 inactive。
aof_rewrite_enabled = true
# 触发 rewrite 的 AOF 最小字节数。可选范围：1..INT64_MAX。
aof_rewrite_min_bytes = 29360128
# 相对上次 rewrite 的最小增长字节数。可选范围：1..INT64_MAX。
aof_rewrite_min_growth_bytes = 67108864
# 触发 rewrite 的最小增长百分比。可选范围：1..1000。
aof_rewrite_growth_percent = 50
# 旧 dump 文件路径，仅用于兼容观察。可选值：绝对路径或相对 server.data_dir 的路径。
legacy_dump_path = kvstore-embedding.dat
# 启动恢复顺序。当前唯一可选值：rdb_then_aof_then_index。
startup_recovery_order = rdb_then_aof_then_index

[vector]
# 是否启用 V 族向量功能。可选值：true、false。
enabled = true
# 向量索引。可选值：core_flat、core_hnsw_v2；本文件采用 HNSW 产品检索路径。
index_type = core_hnsw_v2
# 向量维度。可选范围：1..1048576；必须等于 embedding.output_dimension。
dimension = 512
# 距离度量。可选值：ip、l2、cosine；归一化 BGE embedding 使用 ip。
metric = ip
# 是否归一化向量。当前可选值仅为 true。
normalize = true
# HNSW 每层邻居数 M。可选范围：48..65535。
hnsw_m = 48
# HNSW 第 0 层邻居数 M0。可选范围：M..65535。
hnsw_m0 = 96
# HNSW 构建搜索宽度。可选范围：M0..2147483647。
hnsw_ef_construction = 512
# HNSW 默认查询搜索宽度。100K 单客户端产品压测中，128 是高召回/低延迟平衡点。
hnsw_ef_search = 128
# 向量记录和索引初始容量。应不小于部署目标规模，避免 HNSW 运行时扩容。
initial_capacity = 100000
# VSEARCH 未显式给出 topK 时的默认值。可选范围：1..1024。
default_topk = 1
# VSEARCH 默认分数阈值。可选范围：-1.0..1.0。
default_threshold = 0.75
# scope 查询的 overfetch 倍数。可选范围：1..32。
scope_overfetch_factor = 4
# 距离计算后端。可选值：auto、fallback、avx2。
distance_backend = auto

[embedding]
# 文本向量生成器。可选值：hash、local_c；本文件使用本地 C ABI/ONNX 路径。
provider = local_c
# ONNX 模型路径。可选值：可读常规文件的绝对路径，或相对 server.config_root 的路径。
model_path = models/bge-small-zh-v1.5/model.onnx
# tokenizer 词表路径。可选值：可读常规文件的绝对路径，或相对 server.config_root 的路径。
vocab_path = models/bge-small-zh-v1.5/vocab.txt
# 输出维度。可选范围：1..1048576；必须等于 vector.dimension。
output_dimension = 512
# 模型版本标签。可选值：任意非空字符串；用于兼容性和可观测性。
model_version = bge-small-zh-v1.5
# ONNX 单 session 算子内线程数。可选范围：1..256。
intra_op_threads = 1
# ONNX 算子间线程数。可选范围：0..256；0 由运行时决定。
inter_op_threads = 0
# ONNX 图优化级别。可选值：disable、basic、extended、all。
ort_graph_optimization = basic
# ONNX 执行模式。可选值：sequential、parallel。
ort_execution_mode = sequential
# 是否启用 embedding prepare worker pool。可选值：true、false。
worker_pool_enabled = true
# prepare worker 数量。可选范围：1..64；与 intra_op_threads 的乘积决定 CPU 资源量。
worker_threads = 1
# prepare 队列容量。可选范围：1..1048576。
worker_queue_capacity = 1024
# 是否为每个 worker 创建独立 runtime。可选值：true、false。
per_thread_runtime_enabled = false
# per-thread runtime 创建失败时是否允许回退到共享互斥路径。可选值：true、false。
per_thread_runtime_fallback_mutex = true
# 是否让多个 session 共享 ORT Env。可选值：true、false。
shared_ort_env_enabled = true
# 输入文本最大字节数。可选范围：1..2147483647。
max_text_bytes = 512
# tokenizer 最大 token 数。可选范围：2..512；当前固定上限为 512。
max_tokens = 512
# 是否启用 embedding 结果缓存。可选值：true、false。
cache_enabled = true
# embedding cache 最大条目数。可选范围：1..10000000。
cache_capacity = 10000
# embedding cache TTL，单位毫秒。可选范围：1..2147483647。
cache_ttl_ms = 3600000
# embedding cache 淘汰策略。当前唯一可选值：lru。
cache_policy = lru

[vector_snapshot]
# 是否启用 HNSW 派生索引快照。可选值：true、false；core_flat 下保持关闭。
enabled = false

[vector_rebuild]
# 是否允许 VINDEX 异步重建。可选值：true、false。
async_enabled = true
# rebuild delta 初始容量。可选范围：1..2147483647。
delta_initial_capacity = 16
# rebuild delta 最大条数。可选范围：delta_initial_capacity..2147483647。
delta_max_entries = 1000000
# 异步重建失败后的重试策略。当前唯一可选值：manual。
retry_policy = manual
# 是否允许取消异步重建。可选值：true、false。
cancel_enabled = true
# publish 成功后是否尝试写索引快照。可选值：true、false；快照关闭时处于 inactive。
write_snapshot_after_publish = true

[replication]
# 可靠复制传输。可选值：disabled、tcp；本文件是单机配置。
transport = disabled
# 全量同步策略。当前唯一可选值：required。
full_sync_policy = required
# 从节点索引未就绪时的查询策略。当前唯一可选值：reject。
not_ready_query_policy = reject

[ebpf]
# eBPF 模式。可选值：disabled、observe、experimental_mirror；本文件关闭 eBPF。
mode = disabled

[observability]
# 日志级别。可选值：error、warn、info、debug。
log_level = warn
# 是否异步写日志。可选值：true、false。
log_async = false
# 日志文件。相对路径以 server.data_dir 为基准；不配置时输出到 stderr。
log_path = kvstore.log
# 是否采集 VSEARCH 分阶段统计。可选值：true、false。
vsearch_stage_stats_enabled = false
# 是否启用 embedding 细粒度 profiling。可选值：true、false。
embedding_profile_enabled = false
# 是否启用 HNSW 构建 profiling。可选值：true、false。
hnsw_build_profile_enabled = false
# 是否启用 HNSW 搜索热循环 profiling。可选值：true、false；正式性能模式应为 false。
hnsw_search_profile_enabled = false
