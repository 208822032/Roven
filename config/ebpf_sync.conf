# KVLite eBPF 观测/实验镜像统一配置模板。
# ebpf_syncd 已不再解析旧 master_ip/slave_ip 格式；应使用：
#   src/eBPF/ebpf_syncd --config config/ebpf_sync.conf
# 安全默认值为 disabled。启用前必须以 ENABLE_EBPF=1 构建并确认内核权限。

[server]
# 节点角色。可选值：master、slave；实验镜像源使用 master。
role = master
# 配置资源根目录。可选值：绝对路径或相对本配置文件目录的路径。
config_root = ..
# 运行数据目录。可选值：绝对路径，或相对 config_root 的路径。
data_dir = data
# 测试模式。可选值：true、false。
test_mode = false

[network]
# KVLite 源服务监听地址。可选值：合法 IPv4 地址。
listen_address = 0.0.0.0
# KVLite 源服务端口。可选范围：1..65535。
port = 8080
# 网络模型。可选值：reactor、proactor、ntyco。
mode = reactor
# 网络工作线程数。当前可选值仅为 1。
worker_threads = 1
# 最大并发连接数。可选范围：1..1024。
max_connections = 1024
# TCP listen backlog。可选范围：1..65535。
listen_backlog = 1024
# 单个请求最大字节数。可选范围：1024..67108864。
max_request_bytes = 10485760
# 单个响应最大字节数。可选范围：1024..2097152。
max_response_bytes = 2097152
# 单次读取最多解析的命令数。可选范围：1..1000000。
max_commands_per_read = 1024

[storage]
# 内存分配后端。可选值：pool、system、jemalloc。
memory_backend = pool
# 默认存储引擎。可选值：array、rbtree、hash、skiptable。
default_engine = array
# 启用的存储引擎。可选值：四种引擎的无重复逗号分隔组合。
enabled_engines = array,rbtree,hash,skiptable
# array 初始容量。可选范围：1..10000000。
array_initial_capacity = 2048
# hash 初始容量。可选范围：1..10000000。
hash_initial_capacity = 1048576
# 单值逻辑大小上限，单位字节。可选范围：0..2147483647。
max_value_bytes = 10485760

[ttl]
# 是否启用 TTL 命令语义。可选值：true、false。
enabled = true
# 是否启用后台主动过期扫描。可选值：true、false。
scan_enabled = true
# 后台扫描周期，单位毫秒。可选范围：10..86400000。
scan_interval_ms = 1000
# 每轮扫描预算。可选范围：1..1000000。
scan_budget = 32

[persistence]
# 是否启用 RDB。可选值：true、false；本实验模板关闭持久化。
rdb_enabled = false
# RDB 文件路径。可选值：绝对路径，或相对 server.data_dir 的路径。
rdb_path = kvstore-ebpf.rdb
# 是否启用 AOF。可选值：true、false；本实验模板关闭持久化。
aof_enabled = false
# AOF 文件路径。可选值：绝对路径，或相对 server.data_dir 的路径。
aof_path = kvstore-ebpf.aof
# AOF 刷盘策略。可选值：always、everysec、no。
aof_fsync = no
# 是否启用 AOF rewrite。可选值：true、false；AOF 关闭时处于 inactive。
aof_rewrite_enabled = false
# 旧 dump 文件路径，仅用于兼容观察。可选值：绝对路径或相对 server.data_dir 的路径。
legacy_dump_path = kvstore-ebpf.dat
# 启动恢复顺序。当前唯一可选值：rdb_then_aof_then_index。
startup_recovery_order = rdb_then_aof_then_index

[vector]
# 是否启用 V 族向量功能。可选值：true、false；eBPF 实验镜像不承担向量可靠复制。
enabled = false

[replication]
# 可靠复制传输。可选值：disabled、tcp；experimental_mirror 与 tcp 互斥。
transport = disabled
# 全量同步策略。当前唯一可选值：required。
full_sync_policy = required
# 从节点未就绪时的查询策略。当前唯一可选值：reject。
not_ready_query_policy = reject

[ebpf]
# eBPF 模式。可选值：disabled、observe、experimental_mirror；启用时修改此字段。
mode = disabled
# eBPF object 路径。可选值：可读文件的绝对路径，或相对 server.config_root 的路径。
object_path = src/eBPF/ebpf_kern.o
# 被观测 KVLite 源服务的 IPv4 地址。可选值：合法 IPv4 地址。
observe_host = 127.0.0.1
# 被观测 KVLite 源服务端口。可选范围：1..65535。
observe_port = 8080
# 实验镜像目标。可选值：一个或多个逗号分隔的 IPv4:port；仅 experimental_mirror 使用。
mirror_targets = 127.0.0.1:8081
# BPF ring buffer 大小，单位字节。可选范围：4096..1073741824，且必须是 2 的幂。
ring_buffer_bytes = 16777216
# 单个 eBPF 事件最大字节数。可选范围：1..4096。
max_event_bytes = 4096
# 用户态发送队列容量。可选范围：1..1048576。
user_queue_capacity = 65535
# 用户态批量刷新间隔，单位微秒。可选范围：0..10000000；0 表示不延迟。
flush_interval_us = 10000

[observability]
# 日志级别。可选值：error、warn、info、debug。
log_level = info
# 是否异步写日志。可选值：true、false。
log_async = false
# 是否采集 VSEARCH 分阶段统计。可选值：true、false；向量关闭时处于 inactive。
vsearch_stage_stats_enabled = false
# 是否启用 embedding profiling。可选值：true、false；向量关闭时处于 inactive。
embedding_profile_enabled = false
# 是否启用 HNSW 构建 profiling。可选值：true、false；向量关闭时处于 inactive。
hnsw_build_profile_enabled = false
# 是否启用 HNSW 搜索 profiling。可选值：true、false；向量关闭时处于 inactive。
hnsw_search_profile_enabled = false
